<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pylontech Dashboard</title>
<link rel="stylesheet" href="/static_style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<header class="topbar">
    <button class="burger" onclick="toggleSidebar()">☰</button>

    <div class="title-with-icons">
        <img src="/Batterie.png" class="logo-icon">
        <h1 id="title_app">Pylontech Monitor</h1>
        <img src="/Batterie.png" class="logo-icon">
    </div>

    <div class="langbox">
        <select id="langsel" onchange="setLanguage(this.value)">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
            <option value="sx">Sächsisch</option>
            <option value="ba">Bayrisch</option>			
        </select>
    </div>
</header>

<aside id="sidebar" class="sidebar">
<nav id="sidebar-nav">

<a id="nav_dashboard"   href="/dashboard">Dashboard</a>
<a id="nav_basevalue"   href="/basevalue">Basevalue</a>
<a id="nav_celldata"    href="/celldata">Celldata</a>
<a id="nav_statistic"   href="/statistic">Statistic</a>
<a id="nav_console"     href="/console">Battery Console</a>
<a id="nav_connection"  href="/connection">Connection</a>
<a id="nav_log"         href="/log">Log</a>
<a id="nav_health"      href="/health">Health</a>
<span id="service-links"></span>


</nav>
</aside>

<main id="content"></main>

<script src="/layout.js"></script>

</body>
</html>

<h2 id="conn_title"></h2>

<script src="/static_connection.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", initConnectionPage);
</script>

<!-- WIFI ------------------------------------------------------------ -->

<div class="conn-box wifi-box">

    <div class="conn-header wifi-header" id="conn_wifi_header"></div>

    <div class="conn-body">

        <div id="wifi_status"></div>

        <button onclick="wifiScan()" id="conn_wifi_scan"></button>

        <div id="wifi_scanlist"></div>

        <label>
            <input type="checkbox" id="wifi_manual" onchange="wifiToggleManual()">
            <span id="conn_wifi_manual"></span>
        </label>

        <div id="wifi_manual_box" style="display:none;">
            <table>
                <tr>
                    <td id="conn_wifi_ssid"></td>
                    <td><input id="wifi_ssid" type="text"></td>
                </tr>

                <tr>
                    <td id="conn_wifi_pass"></td>
                    <td><input id="wifi_pass" type="password"></td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <!-- FIX: wifiConnect() existiert NICHT → ersetzt durch wifiConnectScan -->
                        <button onclick="wifiConnectScan(document.getElementById('wifi_ssid').value)" id="conn_wifi_connect"></button>
                    </td>
                </tr>
            </table>
        </div>

        <div id="wifi_msg" class="msg"></div>

    </div>
</div>

<!-- MQTT ------------------------------------------------------------ -->

<div class="conn-box mqtt-box">

    <div class="conn-header mqtt-header" id="conn_mqtt_header"></div>

    <div class="conn-body">

        <table class="conn-table">

            <tr><td id="conn_mqtt_enabled"></td><td><input type="checkbox" id="mqtt_enabled"></td></tr>
            <tr><td id="conn_mqtt_server"></td><td><input type="text" id="mqtt_server"></td></tr>
            <tr><td id="conn_mqtt_port"></td><td><input type="number" id="mqtt_port"></td></tr>
            <tr><td id="conn_mqtt_user"></td><td><input type="text" id="mqtt_user"></td></tr>
            <tr><td id="conn_mqtt_pass"></td><td><input type="password" id="mqtt_pass"></td></tr>
            <tr><td id="conn_mqtt_topic"></td><td><input type="text" id="mqtt_topic"></td></tr>

            <tr>
                <td></td>
                <td><button class="btn-save" onclick="mqttSave()" id="conn_mqtt_save"></button></td>
            </tr>

        </table>

        <div id="mqtt_msg" class="msg"></div>

    </div>
</div>

<!-- NTP / TIME ------------------------------------------------------ -->

<div class="conn-box ntp-box">

    <div class="conn-header ntp-header" id="conn_ntp_header"></div>

    <div class="conn-body">

        <label><input type="checkbox" id="ntp_gateway" onchange="ntpModeSelect('gateway')"> <span id="conn_ntp_gateway"></span></label><br>
        <label><input type="checkbox" id="ntp_manual" onchange="ntpModeSelect('manual')"> <span id="conn_ntp_manual"></span></label><br>
        <label><input type="checkbox" id="time_manual" onchange="ntpModeSelect('time')"> <span id="conn_ntp_time"></span></label>

        <div id="ntp_manual_box" style="display:none; margin-top:10px;">
            <table class="conn-table">
                <tr><td id="conn_ntp_server"></td><td><input type="text" id="ntp_server"></td></tr>
            </table>
        </div>

        <div id="time_manual_box" style="display:none; margin-top:10px;">
            <table class="conn-table">
                <tr><td id="conn_time_date"></td><td><input type="date" id="time_date"></td></tr>
                <tr><td id="conn_time_time"></td><td><input type="time" id="time_time"></td></tr>
                <tr><td id="conn_time_dst"></td><td><input type="checkbox" id="time_dst"></td></tr>
            </table>
        </div>

        <h4 id="conn_tz_header"></h4>

        <table class="conn-table">
            <tr><td id="conn_tz_region"></td><td><select id="tz_region"></select></td></tr>
            <tr><td id="conn_tz_city"></td><td><select id="tz_city"></select></td></tr>
        </table>

        <input type="hidden" id="tz_full">

        <button class="btn-save" onclick="timeSave()" id="conn_time_save"></button>

        <div id="time_msg" class="msg"></div>

        <h4 id="conn_ntp_server_header"></h4>
        <div id="ntp_current">–</div>

    </div>
</div>

<!-- IP CONFIG ------------------------------------------------------- -->

<div class="conn-box ip-box">

    <div class="conn-header ip-header" id="conn_ip_header"></div>

    <div class="conn-body">

        <label>
            <input type="checkbox" id="ip_dhcp" onchange="ipToggleDhcp()">
            <span id="conn_ip_dhcp"></span>
        </label>

        <div id="ip_static_box" style="display:none; margin-top:10px;">
            <table class="conn-table">
                <tr><td id="conn_ip_addr"></td><td><input type="text" id="ip_addr"></td></tr>
                <tr><td id="conn_ip_mask"></td><td><input type="text" id="ip_mask"></td></tr>
                <tr><td id="conn_ip_gw"></td><td><input type="text" id="ip_gw"></td></tr>
                <tr><td id="conn_ip_dns"></td><td><input type="text" id="ip_dns"></td></tr>
            </table>
        </div>

        <button class="btn-save" onclick="ipSave()" id="conn_ip_save"></button>

        <div id="ip_msg" class="msg"></div>

    </div>
</div>

<h2 id="log_title"></h2>

<!-- Oberes Logfenster -->
<div class="log-box">
    <pre id="logbox">loading...</pre>
</div>

<!-- Reload Button -->
<div class="box" style="margin-top: 10px;">
    <button onclick="loadLog()" id="log_reload"></button>
</div>

<!-- Log Level Auswahl -->
<div class="box" style="margin-top: 10px;">
    <h3 id="log_filter"></h3>

    <label><input type="checkbox" id="log_info_cb"> <span id="log_info"></span></label>
    <label><input type="checkbox" id="log_warn_cb"> <span id="log_warn"></span></label>
    <label><input type="checkbox" id="log_error_cb"> <span id="log_error"></span></label>
    <label><input type="checkbox" id="log_debug_cb"> <span id="log_debug"></span></label>

    <button onclick="saveLogLevel()" id="log_save"></button>

    <pre id="logmsg"></pre>
</div>

<!-- Service-Modus -->
<div class="box" style="margin-top: 20px;">
    <h3 id="log_service_header"></h3>

    <label>
        <input type="checkbox" id="serviceToggle">
        <span id="log_service_enable"></span>
    </label>
</div>

<script src="/static_log.js"></script>

<div class="content">

    <h2 id="base_title"></h2>

    <div class="conn-grid-3">

        <!-- Temperatur -->
        <div class="conn-box">
            <div class="conn-header" id="base_temp_header"></div>
            <div class="conn-body">
                <label>
                    <input id="use_fahrenheit" type="checkbox">
                    <span id="base_temp_label"></span>
                </label>
            </div>
        </div>

        <!-- MQTT -->
        <div class="conn-box">
            <div class="conn-header" id="base_mqtt_header"></div>
            <div class="conn-body">
                <label>
                    <span id="base_topic_pwr"></span><br>
                    <input id="topic_pwr" type="text">
                </label>
                <br><br>
                <label>
                    <span id="base_topic_stack"></span><br>
                    <input id="topic_stack" type="text">
                </label>
            </div>
        </div>

        <!-- Intervall -->
        <div class="conn-box">
            <div class="conn-header" id="base_interval_header"></div>
            <div class="conn-body">
                <label>
                    <span id="base_interval_pwr"></span><br>
                    <input id="interval_pwr" type="number" min="1">
                </label>
            </div>
        </div>

    </div>

    <!-- Tabelle -->
    <div class="conn-box">
        <div class="conn-header" id="base_table_header"></div>
        <div class="conn-body">
            <table class="conn-table">
                <thead>
                    <tr>
                        <th id="base_col_field"></th>
                        <th id="base_col_display"></th>
                        <th id="base_col_raw"></th>
                        <th id="base_col_factor"></th>
                        <th id="base_col_unit"></th>
                        <th id="base_col_mqtt"></th>
                        <th id="base_col_send"></th>
                    </tr>
                </thead>
                <tbody id="pwr_table"></tbody>
            </table>
        </div>
    </div>

    <button class="btn-save" id="base_btn_save" onclick="pwrSave()"></button>

</div>

<script src="/static_basevalue.js"></script>
